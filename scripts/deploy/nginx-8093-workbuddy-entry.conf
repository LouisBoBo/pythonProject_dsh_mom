# WorkBuddy 公网入口（8093 HTTPS）— 与本机 :3081 产品入口对齐
#
# 分流（不可混）：
#   /                    → 127.0.0.1:3081  聊天壳（产品唯一入口）
#   /api/*、/remote/*、/plugins/* 等同壳
#   /workbuddy/          → 127.0.0.1:8095  引擎 SPA + /workbuddy/api/*
#   /proxy/8000|8095/    → 引擎（兼容旧 client 把 127.0.0.1:8000 改写）
#   /proxy/1878x/        → 插件本机端口
#   /knowledge-api/      → 3081 公司知识库公开 API
#   /remote/api/auth/    → 引擎鉴权（DSH remotes 误包一层时的兼容）
#   /api/auth/{login,me,touch,logout,refresh} → 引擎（旧 client / 误路由兜底）
#   /dsh-market/      → 3081；Origin/Host 对齐 127.0.0.1:3081（否则 sameOrigin → untrusted origin）
#   /plugins/@deepseek-ai/dsh-client-connection/client.js
#                     → sub_filter 钉 isLoopback:true（否则 Settings→模型「unavailable in this browser」）
#   其余 /api/*（含 pair、events、heartbeat）仍走 3081 聊天壳
#
# 禁止：location /api/ 整段反代引擎（会把 pair/heartbeat、events.host 打到引擎 404）

upstream wb_harness_3081 {
    server 127.0.0.1:3081;
}

upstream wb_engine_8095 {
    server 127.0.0.1:8095;
}

server {
    listen 8093 ssl;
    listen [::]:8093 ssl;
    server_name _;

    ssl_certificate     /www/server/panel/vhost/cert/dsh-workbuddy/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dsh-workbuddy/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /knowledge-api/ {
        proxy_pass http://wb_harness_3081/knowledge-api/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # DSH remotes 偶发把引擎登录打成 /remote/api/auth/* → 转到引擎
    location /remote/api/auth/ {
        proxy_pass http://wb_engine_8095/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }

    # 仅 WorkBuddy 账号接口走引擎；绝不吞 DSH /api/auth/pair 等
    location ~ ^/api/auth/(login|me|touch|logout|refresh)/?$ {
        proxy_pass http://wb_engine_8095;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }

    location ~ ^/proxy/(8000|8095)/(.*)$ {
        proxy_pass http://127.0.0.1:8095/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location ~ ^/proxy/(1878[0-9]|1879[0-9])/(.*)$ {
        proxy_pass http://127.0.0.1:$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    location /workbuddy/ {
        proxy_pass http://wb_engine_8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'workbuddy-ok\n';
    }

    # Settings→模型：client 用 page hostname 判 isLoopback；公网 8093 为 false
    # → SettingsDescribeMirror 走 memory、永不调 settings.describe →
    # 「settings are unavailable in this browser」。
    # location / 已把 Host 伪装成 127.0.0.1:3081，特权 RPC 本就可通；
    # 此处只钉 isLoopback:true，让浏览器真正发起 describe（不改 DSH 源码）。
    location ~ ^/plugins/@deepseek-ai/dsh-client-connection/client\.js {
        proxy_pass http://wb_harness_3081;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        sub_filter_once on;
        sub_filter_types text/javascript application/javascript;
        sub_filter "isLoopback: pageLocation === void 0 || isLoopbackHostname(pageLocation.hostname)" "isLoopback: true";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 插件市场变更接口：sameOrigin 要求 Origin.host === Host。
    # 公网壳入口 Host 固定为 127.0.0.1:3081 且清空 Origin → 必 403 untrusted origin。
    # 此处 Origin 与 Host 对齐为环回，不改动全局 / 的 remotes 伪装策略。
    location /dsh-market/ {
        proxy_pass http://wb_harness_3081;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header Origin http://127.0.0.1:3081;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;
    }

    # 产品唯一公网入口 → 3081 聊天壳（含 DSH /api/* /remote/* /plugins/*）
    location / {
        proxy_pass http://wb_harness_3081;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter "var w=window,loc=w.location,h=loc.hostname;if" "var w=window,loc=w.location,h=loc.hostname;return;if";

        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/dsh-workbuddy-8093.log;
    error_log  /www/wwwlogs/dsh-workbuddy-8093.error.log;
}
